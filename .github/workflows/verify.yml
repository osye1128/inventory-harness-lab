name: Verify

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SESSION_SECRET: ci-only-long-test-secret-change-me
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select Protected comparison base
        id: protected-base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "GITHUB_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          elif [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "PROTECTED_BASE=$(git hash-object -t tree /dev/null)" >> "$GITHUB_ENV"
          else
            echo "PROTECTED_BASE=$BEFORE_SHA" >> "$GITHUB_ENV"
          fi

      - name: Verify human CODEOWNER approval
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run protected:github

      - name: Run verification
        run: npm run verify
