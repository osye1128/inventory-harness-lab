name: Harness lifecycle

on:
  pull_request:
    types: [closed, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]
  repository_dispatch:
    types: [harness-reentry]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate repository dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: npm run harness:dispatch
      - name: Validate ledger
        run: npm run harness:check
