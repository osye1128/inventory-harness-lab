name: 유지보수 작업
description: 기존 기능의 수정·개선·문서화 작업을 등록합니다.
title: "[유지보수] "
labels:
  - maintenance
body:
  - type: markdown
    attributes:
      value: |
        유지보수 작업은 아래 6개 항목을 구체적으로 작성해 주세요.
        SSOT 또는 Issue와 충돌하는 내용이 있으면 `NEEDS_HUMAN` 상태로 선언하고 사람의 판단을 요청합니다.

  - type: textarea
    id: background
    attributes:
      label: 1. 배경
      description: 왜 이 작업이 필요한가요?
      placeholder: 현재 문제와 작업이 필요한 이유를 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: 2. 변경할 내용
      description: 무엇을 수정하나요? 변경 대상과 범위를 구체적으로 작성해 주세요.
      placeholder: 수정할 파일, 기능, 문서 또는 동작을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: completion-criteria
    attributes:
      label: 3. 종료 조건
      description: |
        기준·수치·기대 결과를 포함해 실행으로 참·거짓을 판정할 수 있게 작성해 주세요. 모호한 표현(정상 동작, 문제 없음)만 적지 마세요.

        되는 예:
        - [ ] `npm run verify` 종료 코드가 0이고 Types/Lint/Test/Build가 모두 통과한다.
        - [ ] 상품 `비건쿠키 딸기 40g`의 시드 수량이 정확히 80개로 표시된다.
        - [ ] 390px 화면에서 가로 스크롤이 없고, 테스트 결과가 `3 files passed, 19 tests passed`다.

        안 되는 예:
        - [ ] 기능이 정상 동작한다.
        - [ ] 문제가 해결된다.
        - [ ] 테스트를 통과한다.

        작성 형식:
        - [ ] 실행 대상/조건: ... · 판정 기준: ... · 기대 결과: ...
        - [ ] 실행 대상/조건: ... · 판정 기준: ... · 기대 결과: ...
      placeholder: |
        - [ ] 실행 대상/조건: ... · 판정 기준: ... · 기대 결과: ...
        - [ ] 실행 대상/조건: ... · 판정 기준: ... · 기대 결과: ...
    validations:
      required: true

  - type: textarea
    id: machine-verification
    attributes:
      label: 4. 기계 검증
      description: |
        실제 실행할 명령, 입력·조건, 판정 기준, 기대 결과를 작성해 주세요. 명령의 종료 코드와 핵심 출력 수치도 가능한 한 명시하세요.

        Issue의 종료 조건을 검증하는 테스트 파일을 다음 규칙으로 만드세요:
        `tests/issues/issue-{Issue 번호}-{기능명}.test.ts`
        예: Issue #42의 재고 이동 작업 → `tests/issues/issue-42-stock-transfer.test.ts`
        테스트 파일은 각 종료 조건에 대응하는 실행 조건과 기대값을 검증해야 합니다. 종료 조건을 모두 덮는 테스트가 없거나 테스트가 실패하면 작업 완료로 보지 마세요.
        현재 Vitest 설정의 `tests/**/*.test.ts` 패턴이 이 경로를 포함하므로 `npm test`에서 자동 실행됩니다.

        되는 예:
        - 테스트 파일: `tests/issues/issue-42-stock-transfer.test.ts` · 명령: `npm test -- tests/issues/issue-42-stock-transfer.test.ts` · 판정 기준: 종료 코드 0 · 기대 결과: 종료 조건 3개 모두 통과
        - 명령: `npm run verify` · 조건: 검증 전용 DB에서 실행 · 판정 기준: 종료 코드 0 · 기대 결과: Protected, Prepare, Types, Lint, Architecture Check, Test, Build 모두 통과
        - 명령: `npx tsx scripts/verify-m1.ts` · 판정 기준: 모든 항목 ✅ · 기대 결과: 실패 항목 0개

        안 되는 예:
        - 테스트를 실행한다.
        - 자동 검증한다.
        - 문제가 없으면 완료한다.
        - Issue 테스트 파일 없이 `npm test`만 실행한다.
      placeholder: |
        테스트 파일: `tests/issues/issue-{Issue 번호}-{기능명}.test.ts`
        명령: ... · 조건: ... · 판정 기준: ... · 기대 결과: ...
        추가 검증 명령: ... · 판정 기준: ... · 기대 결과: ...

        테스트 파일을 만들지 않을 경우 그 이유와 대체 검증을 명시해 주세요.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 5. 건드리면 안 되는 것
      description: 변경하면 안 되는 파일, 기능, 데이터 또는 정책 경계를 작성해 주세요.
      placeholder: 변경 금지 대상을 작성해 주세요. 없으면 없다고 명시해 주세요.
    validations:
      required: true

  - type: input
    id: max-implementation-loops
    attributes:
      label: 6. 구현 루프 최대 횟수
      description: |
        변경 → 지정된 기계 검증 실행 → 결과 판정까지를 1회로 계산합니다. 입력한 횟수는 전체 시도 상한이며, 검증이 통과하면 즉시 종료합니다.
        정해진 횟수 안에 검증을 통과하지 못하면 AI는 반복·추가 수정·횟수 초과를 하지 않고 `NEEDS_HUMAN` 상태로 멈춰 사람에게 넘깁니다. 마지막 실패 결과, 실제 시도 횟수, 남은 쟁점, 사람에게 필요한 판단을 기록해야 합니다.

        되는 예:
        - `3` 입력 후 2회째 검증 통과 → 2회에서 종료
        - `3`회 모두 실패 → 3회째에서 멈추고 `NEEDS_HUMAN`으로 이관

        안 되는 예:
        - `0`, 음수, 빈 값 입력
        - 무제한 또는 횟수 상한 없이 계속 반복
        - 3회 실패 후 AI가 4회째를 임의로 재시도
      placeholder: "예: 3 (총 시도 상한)"
      value: "3"
    validations:
      required: true
      pattern: "^[1-9][0-9]*$"

  - type: input
    id: domain-source
    attributes:
      label: 재고 도메인 원본
      description: 관련 시 [`docs/01-requirements.md`](../../docs/01-requirements.md)를 참조하세요.
      placeholder: 관련 섹션 또는 링크 (선택)

  - type: input
    id: architecture-source
    attributes:
      label: 아키텍처 원본
      description: 관련 시 [`docs/06-architecture.md`](../../docs/06-architecture.md)를 참조하세요.
      placeholder: 관련 섹션 또는 링크 (선택)

  - type: input
    id: related-issue
    attributes:
      label: 관련 Issue 또는 원본
      description: 이 Issue 자체가 작업 원본입니다. 의존 작업이 있으면 Issue 번호나 URL을 적어 주세요.
      placeholder: "#123 또는 https://github.com/osye1128/inventory-harness-lab/issues/123"
